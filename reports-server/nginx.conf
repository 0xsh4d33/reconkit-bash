worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout 65;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_types
        text/plain
        text/css
        text/html
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Server ───────────────────────────────────────────────────────────────
    server {
        listen      80;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;
        charset     utf-8;

        # Reports root → serve index.html
        location / {
            try_files $uri $uri/ /index.html;

            # HTML: no cache (reports update frequently)
            location ~* \.html$ {
                add_header Cache-Control "no-store, no-cache, must-revalidate";
                add_header Pragma        "no-cache";
                expires    -1;
            }

            # JSON index: same – always fresh
            location ~* \.json$ {
                add_header Cache-Control "no-store, no-cache, must-revalidate";
                expires    -1;
            }
        }

        # Healthcheck endpoint (for Docker / load-balancers)
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Block hidden files (.git, .env, etc.)
        location ~ /\. {
            deny all;
        }

        # Custom error pages
        error_page 404 /404.html;
        location = /404.html {
            internal;
            return 404 '<!doctype html><html><head><title>404</title>
<style>body{background:#0f1117;color:#8892a4;font-family:system-ui;
display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.box{text-align:center} h1{font-size:3rem;color:#5b8aff} p a{color:#22d3ee}
</style></head><body><div class="box">
<h1>404</h1><p>Report not found. <a href="/">Back to index</a></p>
</div></body></html>';
            add_header Content-Type text/html;
        }
    }
}
